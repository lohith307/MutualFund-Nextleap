services:
  - type: web
    name: groww-mf-assistant
    runtime: python
    buildCommand: pip install --no-cache-dir --upgrade pip && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GROQ_API_KEY
        sync: false # Set securely in Render dashboard
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: LOG_LEVEL
        value: INFO
      - key: VECTOR_STORE_PATH
        value: corpus/vector_store
      - key: VECTOR_STORE_COLLECTION
        value: mutual_fund_faq

